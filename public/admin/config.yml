backend:
  name: github
  repo: slimbiz237/slim-biz-website
  branch: main
  auth_type: pkce
  app_id: Ov23li6oHaMQFAHcoAEv

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog Posts
    folder: content/blog
    create: true
    delete: true
    format: json
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: string }
      - label: Category
        name: category
        widget: select
        options: [Strategy, Media, Branding, Digital, Training, General]
      - { label: Tag, name: tag, widget: string }
      - { label: Read Time, name: readTime, widget: string, default: "5 min read" }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Body, name: body, widget: markdown }
      - { label: Author, name: author, widget: string, default: "SLIM BIZ Team" }
      - { label: Featured Image URL, name: img, widget: string, required: false }